var GOM_THIEU=null;
function dungTiengAnh(){
try{return prog&&prog.settings&&prog.settings.ui==="en";}catch(e){return false;}
}
function dichCau(t){
var g=t.replace(/\s+/g," ").trim();
if(!g)return t;
var d=TU_DIEN[g];
if(d===undefined){
for(var i=0;i<MAU_DICH.length;i++){
var m=g.match(MAU_DICH[i][0]);
if(m){d=g.replace(MAU_DICH[i][0],MAU_DICH[i][1]);break;}
}
}
if(d===undefined){
if(GOM_THIEU&&/[\u00c0-\u1ef9\u0110\u0111]/.test(g))GOM_THIEU[g]=(GOM_THIEU[g]||0)+1;
return t;
}
var dau=t.match(/^\s*/)[0],cuoi=t.match(/\s*$/)[0];
return dau+d+cuoi;
}
function dichHTML(h){
if(!dungTiengAnh())return h;
var r=String(h);
r=r.replace(/(^|>)([^<>]+)(?=<|$)/g,function(_,truoc,chu){
return truoc+dichCau(chu);
});
r=r.replace(/\b(title|aria-label|data-tip|data-goi|placeholder|alt)="([^"]*)"/g,function(_,k,v){
return k+'="'+dichCau(v)+'"';

cho=true;dang=false;dixa=0;x0=e.clientX;sl0=abc.scrollLeft;
});
abc.addEventListener("pointermove",function(e){
if(!cho)return;
var d=e.clientX-x0;

}
abc.scrollLeft=sl0-d;

function buong(e){
cho=false;

}
abc.addEventListener("pointerup",buong);

abc.addEventListener("click",function(e){

dixa=0;

var rong=abc.clientWidth/abc.scrollWidth;
function dat(cx){
var f=(cx-hop.left-hop.width*rong/2)/(hop.width*(1-rong));
abc.scrollLeft=Math.min(1,Math.max(0,f))*thua;
}
dat(e.clientX);
try{ray2.setPointerCapture(e.pointerId);}catch(err){}
function di(ev){dat(ev.clientX);}
function thoi(ev){
ray2.removeEventListener("pointermove",di);
ray2.removeEventListener("pointerup",thoi);
ray2.removeEventListener("pointercancel",thoi);

}

});

function ghostFit(t,hand){

var co=Math.max(13,Math.min(54,96/Math.max(1.1,rong)));
return '<text class="ghost-text'+(hand?" hand":"")+'" x="56" y="'+

function resample(pts,step){
if(pts.length<2)return pts.slice();
var out=[pts[0]],acc=0;
for(var i=1;i<pts.length;i++){
var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],d=Math.hypot(dx,dy);
if(d<1e-6)continue;
var rem=d,px=pts[i-1][0],py=pts[i-1][1];
while(acc+rem>=step){
var need=step-acc,k=need/rem;
px=px+(pts[i][0]-px)*k;py=py+(pts[i][1]-py)*k;
out.push([px,py]);rem-=need;acc=0;
}
acc+=rem;
}
return out;
}

function pathLen(pts){var L=0;for(var i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L;}
function scoreWriting(refStrokes,usrStrokes){
var REF=[],i,j;
refStrokes.forEach(function(st){st.forEach(function(p){REF.push(p);});});
var USR=[],usrLen=0,refLen=0;
refStrokes.forEach(function(st){refLen+=pathLen(st);});
usrStrokes.forEach(function(st){usrLen+=pathLen(st);resample(st,2.5).forEach(function(p){USR.push(p);});});
if(USR.length<8||!REF.length)return null;
var TOL=6,hit=new Array(REF.length),near=0,seq=[];
for(i=0;i<REF.length;i++)hit[i]=false;
for(i=0;i<USR.length;i++){
var best=-1,bd=1e9;
for(j=0;j<REF.length;j++){
var dx=REF[j][0]-USR[i][0],dy=REF[j][1]-USR[i][1],d=dx*dx+dy*dy;
if(d<=TOL*TOL)hit[j]=true;
if(d<bd){bd=d;best=j;}
}
if(Math.sqrt(bd)<=TOL){near++;seq.push(best);}
}
var covered=0;for(i=0;i<hit.length;i++)if(hit[i])covered++;
var cov=covered/REF.length, prec=near/USR.length;
var up=0,dn=0;
for(i=1;i<seq.length;i++){var dd=seq[i]-seq[i-1];if(dd>0.5)up++;else if(dd<-0.5)dn++;}
var dir=(up+dn)?up/(up+dn):.5;
var lenR=usrLen>0?Math.min(1,refLen/usrLen):0;
var dStroke=Math.abs(usrStrokes.length-refStrokes.length);
var dirOk=prec>=.6;
var raw=Math.pow(cov,1.4)*58+prec*12+dir*30;
raw*=(lenR>=.7?1:(.4+lenR*.857));
raw-=Math.min(18,dStroke*9);
if(dirOk&&dir<.3)raw=Math.min(raw,60);
var sc=Math.max(0,Math.min(100,Math.round(raw)));
var miss=[];
for(i=0;i<REF.length;i+=3)if(!hit[i])miss.push(REF[i]);
var tips=[];
if(cov<.8)tips.push("Còn "+Math.round((1-cov)*100)+"% nét mẫu chưa được phủ — chấm đỏ là chỗ bạn bỏ sót.");
if(dirOk&&dir<.6)tips.push(dir<.3?"Bạn đang viết NGƯỢC chiều — xem lại mẫu ở trên, nét chạy theo hướng ngược lại.":"Thứ tự nét chưa đúng, có đoạn bạn viết ngược lại.");
if(prec<.7)tips.push("Khoảng "+Math.round((1-prec)*100)+"% nét bạn viết nằm lệch ra ngoài chữ mẫu.");
if(lenR<.6)tips.push("Nét viết dài gấp "+(usrLen/Math.max(1,refLen)).toFixed(1)+" lần nét mẫu — bạn tô đi tô lại hoặc vẽ thừa.");
if(dStroke>0)tips.push("Chữ này viết "+refStrokes.length+" nét liền, bạn nhấc bút thành "+usrStrokes.length+" nét.");
if(!tips.length)tips.push("Nét đi đúng chỗ, đúng chiều, đủ số nét. Viết tốt.");
return {score:sc,cov:cov,prec:prec,dir:dir,lenR:lenR,miss:miss,tips:tips};
}

const VOWELS="аеёиоуыэюя";
const THANH_DAT={a:"āáǎà",o:"ōóǒò",e:"ēéěè",i:"īíǐì",u:"ūúǔù","ü":"ǖǘǚǜ"};
const THANH_TRA={};
Object.keys(THANH_DAT).forEach(function(g){
THANH_DAT[g].split("").forEach(function(c,i){THANH_TRA[c]=[g,i+1];});
});
const THANH_TEN=["thanh nhẹ","thanh 1","thanh 2","thanh 3","thanh 4"];
const THANH_TA=["không dấu, đọc nhẹ và ngắn","cao và đều","đi lên","xuống rồi lên","đổ xuống"];
function viTriDau(py){
var i=py.indexOf("a");if(i>=0)return i;
i=py.indexOf("o");if(i>=0)return i;
i=py.indexOf("e");if(i>=0)return i;
var cuoi=-1;
for(var k=0;k<py.length;k++)if("iuü".indexOf(py.charAt(k))>=0)cuoi=k;
return cuoi;
}
function datThanh(goc,vt,t){
if(!t)return goc;
var b=THANH_DAT[goc.charAt(vt)];
if(!b)return goc;
return goc.slice(0,vt)+b.charAt(t-1)+goc.slice(vt+1);
}
function thanhInfo(it){
if(it.t!=="V")return null;
var py=String(it.tr||"").trim().toLowerCase();
if(!py||/\s/.test(py))return null;
var goc="",th=0,vt=-1,i,c,d;
for(i=0;i<py.length;i++){
c=py.charAt(i);d=THANH_TRA[c];
if(d){
if(th)return null;
goc+=d[0];th=d[1];vt=i;
}else goc+=c;
}
if(!/^[a-zü]+$/.test(goc))return null;
if(vt<0)vt=viTriDau(goc);
if(vt<0||!THANH_DAT[goc.charAt(vt)])return null;
return {kieu:"thanh",goc:goc,vt:vt,th:th};
}
function thanhStep(it){
var si=thanhInfo(it);if(!si)return null;
var ds=si.th?[1,2,3,4]:[0,1,2,3,4];
var opts=ds.map(function(t){
return {txt:THANH_TEN[t],
html:'<b class="sv">'+esc(datThanh(si.goc,si.vt,t))+'</b> · '+esc(THANH_TEN[t]),
ok:t===si.th};
});

opts:opts,optCls:"stress",audio:it.ru};
}
const IPA_NGUYEN=["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə",
"iː","ɑː","ɔː","uː","ɜː",
"ɪ","æ","ɒ","ʊ","ʌ","ə","ɔ","ɑ","ɜ","e","i","u"];
function nhanInfo(it){
if(it.t!=="V")return null;
var raw=String(it.tr||"").replace(/^\/|\/$/g,"").trim();
if(!raw||/\s/.test(raw))return null;
var sach="",nuc=[],right=-1,dang=false,i=0,k,hit;
while(i<raw.length){
var c=raw.charAt(i);
if(c==="ˈ"){dang=true;i++;continue;}
if(c==="ˌ"){dang=false;i++;continue;}
hit="";
for(k=0;k<IPA_NGUYEN.length;k++){
if(raw.substr(i,IPA_NGUYEN[k].length)===IPA_NGUYEN[k]){hit=IPA_NGUYEN[k];break;}
}
if(hit){
if(dang&&right<0)right=nuc.length;
nuc.push({v:hit,at:sach.length});
sach+=hit;dang=false;i+=hit.length;continue;
}
sach+=c;i++;
}
if(nuc.length<2||right<0)return null;
return {kieu:"nhan",ipa:sach,nuc:nuc,right:right,raw:raw};
}

function dauInfo(it){

if(/\s/.test(plain.trim()))return null;
var pos=[],i;
for(i=0;i<plain.length;i++)if(VOWELS.indexOf(plain.charAt(i).toLowerCase())>=0)pos.push(i);

var before=plain0(raw.slice(0,k)).length-1;
right=pos.indexOf(before);
}else{
for(i=0;i<pos.length;i++)if(plain.charAt(pos[i]).toLowerCase()==="ё"){right=i;break;}
}
if(right<0)return null;
return {kieu:"dau",plain:plain,pos:pos,right:right};
}

function buildReview(items,tieuDe){

else{

function diemYeu(it){

}

var _giongAnh={};
function gonChu(s){
return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
}
function cachChu(a,b){
var i,j,d=[];
for(i=0;i<=a.length;i++){d[i]=[i];}
for(j=0;j<=b.length;j++)d[0][j]=j;
for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)
d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
return d[a.length][b.length];
}
function giongAnh(it){
if(!it||it.t!=="V")return null;
if(_giongAnh[it.id]!==undefined)return _giongAnh[it.id];
var a=gonChu(it.tr),tot=0,tu="";
String(it.en||"").split(/[\/,;()]|\s+/).forEach(function(w){
var b=gonChu(w);
if(!a||b.length<3)return;
var t=1-cachChu(a,b)/Math.max(a.length,b.length);
if(t>tot){tot=t;tu=w;}

}

function diemTim(hay,tenMuc,cum,tu){

var w=tu[i];
if(w.re.test(hay)){d+=4;tron++;}
else if(w.t.length>1&&hay.indexOf(w.t)>=0)d+=1;

}

if(tuRu){var k2=diemTim(hay,tm,cumRu,tuRu);if(k2.d>k.d)k=k2;}
if(k.d>0)ds.push({it:it,d:k.d,manh:k.manh});

for(i=1;i<=m;i++)for(j=1;j<=n;j++)
d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
return d[m][n];
}
function giongNhau(a,b){
if(!a&&!b)return 1;
var L=Math.max(a.length,b.length);
return L?1-cachChuoi(a,b)/L:0;
}
function dongVan(mau,nghe,nhan){
var m=mau.length,n=nghe.length,d=[],v=[],i,j;
for(i=0;i<=m;i++){d[i]=[];v[i]=[];for(j=0;j<=n;j++){d[i][j]=0;v[i][j]="";}}
for(i=1;i<=m;i++){d[i][0]=i;v[i][0]="x";}
for(j=1;j<=n;j++){d[0][j]=j;v[0][j]="t";}
for(i=1;i<=m;i++)for(j=1;j<=n;j++){
var gia=1-giongNhau(nhoVan(mau[i-1],i-1===nhan),nhoVan(nghe[j-1],i-1===nhan));
var a=d[i-1][j-1]+gia,b=d[i-1][j]+1,c=d[i][j-1]+1;
if(a<=b&&a<=c){d[i][j]=a;v[i][j]="d";}
else if(b<=c){d[i][j]=b;v[i][j]="x";}
else{d[i][j]=c;v[i][j]="t";}
}
var ra=[];i=m;j=n;
while(i>0||j>0){
var b=v[i][j];
if(b==="d"){ra.unshift({mau:mau[i-1],nghe:nghe[j-1],k:i-1});i--;j--;}
else if(b==="x"){ra.unshift({mau:mau[i-1],nghe:null,k:i-1});i--;}
else{ra.unshift({mau:null,nghe:nghe[j-1],k:-1});j--;}
}
return ra;
}
function chamDoc(ru,nghe){
var mau=tachVan(plain(ru)),nh=tachVan(plain(nghe)),nhan=vanTrongAm(ru);
var cap=dongVan(mau,nh,nhan),tot=0,dem=0,loi=[];
cap.forEach(function(c){
if(c.mau===null){loi.push({kieu:"thua",nghe:c.nghe});return;}
dem++;
if(c.nghe===null){c.diem=0;loi.push({kieu:"thieu",mau:c.mau});return;}
c.diem=giongNhau(nhoVan(c.mau,c.k===nhan),nhoVan(c.nghe,c.k===nhan));
tot+=c.diem;
if(c.diem<0.75)loi.push({kieu:"lech",mau:c.mau,nghe:c.nghe,diem:c.diem});
});
var diem=dem?Math.round(tot/dem*100):0;
if(cap.length>mau.length)diem=Math.max(0,diem-8*(cap.length-mau.length));
return {cap:cap,diem:Math.max(0,Math.min(100,diem)),loi:loi,nhan:nhan,mau:mau};
}

<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

return {
doc(path) {
const parts = String(path).split("/").filter(Boolean);
const ref = doc(fs, "users", uid, ...parts);
return {
async get() {
const snap = await getDoc(ref);
return { exists: snap.exists(), data: () => snap.data() };
},
async set(value) {
await setDoc(ref, JSON.parse(JSON.stringify(value)));
}
};
}
};
}
function hoSo(u, truong) {
if (!u) return "";
if (u[truong]) return u[truong];
const ds = u.providerData || [];
for (let i = 0; i < ds.length; i++) if (ds[i] && ds[i][truong]) return ds[i][truong];
