*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:11px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:-.01em}

.hbtn{margin-left:auto;display:flex;gap:4px;flex:none}
.icb{width:40px;height:40px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:16px;color:var(--muted);transition:background .15s,color .15s}
.icb:hover{background:var(--surface-2);color:var(--ink)}
main{padding-block:22px 64px}
h1,h2{font-family:var(--f-head);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:31px}
h2{font-size:19px}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.cyr{font-family:var(--f-cyr)}
.hand{font-family:var(--f-hand)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-head .ln{flex:1;height:1px;background:var(--line)}
.btn{font-family:var(--f-ui);font-weight:600;font-size:17px;line-height:1.2;background:var(--accent);color:var(--on-accent);
display:inline-flex;align-items:center;justify-content:center;gap:8px;
padding:14px 22px;min-height:50px;border-radius:var(--r-sm);transition:transform .12s,box-shadow .15s,opacity .15s;box-shadow:var(--sh)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-lift)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--accent),var(--sh)}
.btn.sm{padding:9px 16px;font-size:15px;min-height:38px}
.btn.wide{width:100%}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;margin:0 0 14px -8px;border-radius:var(--r-sm);

.astrip{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}

.astrip button.seen{background:var(--deep-soft);color:var(--ink)}
.astrip button.known{background:var(--deep);color:#FFFFFF}
.astrip button:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.alegend{font-size:13.5px;color:var(--muted);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.alegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stats{display:flex;margin-top:20px;border-top:1px solid var(--line-soft);padding-top:16px}
.stat{flex:1;min-width:0;padding-right:12px}
.stat b{display:block;font-family:var(--f-head);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:700}
.stat small{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:500}

.syncline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:16px;padding-top:14px;

.syncline i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.syncline b{color:var(--ink);font-weight:600;word-break:break-all}
#nav-acct .ava{width:26px;height:26px;border-radius:var(--r-xs);background:var(--deep);color:#FFFFFF;

.cta .sm2{font-size:14.5px;opacity:.88;margin-top:1px}

.chap{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:var(--surface);

.chap:hover{box-shadow:var(--sh-lift)}
.chap .ci{flex:none;width:38px;height:38px;border-radius:var(--r-xs);background:var(--surface-2);display:grid;place-items:center;

.chap .cb{flex:1;min-width:0}
.chap .t{font-family:var(--f-head);font-weight:700;font-size:16px;letter-spacing:-.01em}
.chap .s{font-size:14px;color:var(--muted);margin-top:1px}
.chap .cv{flex:none;color:var(--muted);font-size:15px;transition:transform .2s}
.chap[aria-expanded="true"]{background:var(--surface-2);box-shadow:none;margin-bottom:4px}
.chap[aria-expanded="true"] .ci{background:var(--deep);color:#FFFFFF}

.chap.alldone .ci{background:var(--deep-soft);color:var(--deep)}
.pbar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;margin-top:7px;max-width:180px}
.pbar>i{display:block;height:100%;background:var(--deep);border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.chapbody{margin:0 0 12px 19px;padding-left:12px;border-left:2px solid var(--line)}
.chapbody .mod{padding:12px 14px}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:8px;transition:transform .12s,box-shadow .15s}
.mod:hover:not(.locked){transform:translateY(-1px);box-shadow:var(--sh-lift)}
.mod .body{flex:1;min-width:0}
.mod .t{font-family:var(--f-head);font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.mod .s{font-size:14px;color:var(--muted);margin-top:1px}

.set.khoa{opacity:.64;box-shadow:inset 0 0 0 1px var(--line)}
.set.khoa .d{color:var(--warn)}
.set.khoa .btn{cursor:not-allowed}
.mod.locked .s{color:var(--warn)}
.mod .go{flex:none;color:var(--muted);font-size:17px}
.ring{--p:0;position:relative;flex:none;width:44px;height:44px;border-radius:50%;
background:conic-gradient(var(--deep) calc(var(--p)*3.6deg),var(--sunken) 0);transition:--p .7s cubic-bezier(.22,1,.36,1)}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}

.mod.done .ring{background:var(--deep)}
.mod.done .ring span{color:var(--deep);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cell{background:var(--surface);border-radius:var(--r-sm);padding:11px 5px;text-align:center;display:block;box-shadow:var(--sh);transition:transform .12s,box-shadow .15s}

.cell.known{background:var(--deep-soft)}
.cell .g{font-family:var(--f-cyr);font-size:22px;line-height:1.15}
.cell .p{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrowpair{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border-radius:var(--r-sm);
box-shadow:var(--sh);overflow:hidden;text-align:center}
.hrowpair>div{padding:10px 6px;min-width:0}
.hrowpair>div+div{border-left:1px solid var(--line-soft);background:var(--surface-2)}
.hrowpair .pr{font-family:var(--f-cyr);font-size:23px;line-height:1.2}
.hrowpair .hw{font-family:var(--f-hand);font-size:29px;line-height:1.2}
.hrowpair .cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.hgrid.trap .hrowpair{box-shadow:inset 0 0 0 1.5px var(--accent),var(--sh)}
.wdemo{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;overflow:hidden}
.wline{position:relative;height:118px;border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden;

linear-gradient(var(--line),var(--line)) 0 84px/100% 1px no-repeat;

@keyframes writein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.wink{font-family:var(--f-hand);font-size:66px;line-height:1;color:var(--ink);padding:0 10px;position:relative;z-index:1}
.wnote{font-size:14.5px;line-height:1.6;color:var(--muted);margin-top:12px}
.pad{position:relative;width:100%;aspect-ratio:16/7;background:var(--surface-2);border-radius:var(--r-sm);
overflow:hidden;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px var(--line)}
.pad::before{content:"";position:absolute;inset:0;
background:repeating-linear-gradient(104deg,transparent 0 26px,var(--line) 26px 27px),
linear-gradient(var(--line),var(--line)) 0 22%/100% 1px no-repeat,
linear-gradient(var(--accent),var(--accent)) 0 78%/100% 1.5px no-repeat;
opacity:.75;pointer-events:none}
.pad .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;

padding-bottom:6%}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.rail{display:flex;gap:3px;margin-bottom:20px}
.rail i{flex:1;height:4px;border-radius:2px;background:var(--sunken);transition:background .3s}
.rail i.on{background:var(--deep)}
.rail i.cur{background:var(--accent)}
.rail i.ro{background:var(--deep-soft)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.anim{animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:26px 20px;text-align:center}
.card .lbl{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);margin-bottom:14px}
.glyph{font-family:var(--f-cyr);font-size:68px;line-height:1.05}
.glyph .hw{font-family:var(--f-hand);color:var(--muted);margin-left:14px}

.tr{color:var(--muted);font-family:var(--f-ui);font-size:16.5px;margin-top:5px}

function animateStrokes(svg,speed){

}

function frame(t){
if(!t0)t0=t;
var e=Math.min(1,(t-t0)/dur),run=e*total,acc=0,placed=false;
for(var i=0;i<inks.length;i++){

if(run>=acc+L)inks[i].style.strokeDashoffset=0;

function resample(pts,step){
if(pts.length<2)return pts.slice();
var out=[pts[0]],acc=0;
for(var i=1;i<pts.length;i++){
var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],d=Math.hypot(dx,dy);
if(d<1e-6)continue;
var rem=d,px=pts[i-1][0],py=pts[i-1][1];
while(acc+rem>=step){
var need=step-acc,k=need/rem;
px=px+(pts[i][0]-px)*k;py=py+(pts[i][1]-py)*k;
out.push([px,py]);rem-=need;acc=0;
}
acc+=rem;
}
return out;
}

function scoreWriting(refStrokes,usrStrokes){
var REF=[],i,j;
refStrokes.forEach(function(st){st.forEach(function(p){REF.push(p);});});
var USR=[],usrLen=0,refLen=0;
refStrokes.forEach(function(st){refLen+=pathLen(st);});
usrStrokes.forEach(function(st){usrLen+=pathLen(st);resample(st,2.5).forEach(function(p){USR.push(p);});});
if(USR.length<8||!REF.length)return null;
var TOL=6,hit=new Array(REF.length),near=0,seq=[];
for(i=0;i<REF.length;i++)hit[i]=false;
for(i=0;i<USR.length;i++){
var best=-1,bd=1e9;
for(j=0;j<REF.length;j++){
var dx=REF[j][0]-USR[i][0],dy=REF[j][1]-USR[i][1],d=dx*dx+dy*dy;
if(d<=TOL*TOL)hit[j]=true;
if(d<bd){bd=d;best=j;}
}
if(Math.sqrt(bd)<=TOL){near++;seq.push(best);}
}
var covered=0;for(i=0;i<hit.length;i++)if(hit[i])covered++;
var cov=covered/REF.length, prec=near/USR.length;
var up=0,dn=0;
for(i=1;i<seq.length;i++){var dd=seq[i]-seq[i-1];if(dd>0.5)up++;else if(dd<-0.5)dn++;}
var dir=(up+dn)?up/(up+dn):.5;
var lenR=usrLen>0?Math.min(1,refLen/usrLen):0;
var dStroke=Math.abs(usrStrokes.length-refStrokes.length);
var dirOk=prec>=.6;
var raw=Math.pow(cov,1.4)*58+prec*12+dir*30;
raw*=(lenR>=.7?1:(.4+lenR*.857));
raw-=Math.min(18,dStroke*9);
if(dirOk&&dir<.3)raw=Math.min(raw,60);
var sc=Math.max(0,Math.min(100,Math.round(raw)));
var miss=[];
for(i=0;i<REF.length;i+=3)if(!hit[i])miss.push(REF[i]);
var tips=[];
if(cov<.8)tips.push("Còn "+Math.round((1-cov)*100)+"% nét mẫu chưa được phủ — chấm đỏ là chỗ bạn bỏ sót.");
if(dirOk&&dir<.6)tips.push(dir<.3?"Bạn đang viết NGƯỢC chiều — xem lại mẫu ở trên, nét chạy theo hướng ngược lại.":"Thứ tự nét chưa đúng, có đoạn bạn viết ngược lại.");
if(prec<.7)tips.push("Khoảng "+Math.round((1-prec)*100)+"% nét bạn viết nằm lệch ra ngoài chữ mẫu.");
if(lenR<.6)tips.push("Nét viết dài gấp "+(usrLen/Math.max(1,refLen)).toFixed(1)+" lần nét mẫu — bạn tô đi tô lại hoặc vẽ thừa.");
if(dStroke>0)tips.push("Chữ này viết "+refStrokes.length+" nét liền, bạn nhấc bút thành "+usrStrokes.length+" nét.");

const VOWELS="аеёиоуыэюя";
function stressInfo(it){
if(it.t!=="V")return null;
var raw=it.ru, plain=plain0(raw);
if(/\s/.test(plain.trim()))return null;
var pos=[],i;
for(i=0;i<plain.length;i++)if(VOWELS.indexOf(plain.charAt(i).toLowerCase())>=0)pos.push(i);
if(pos.length<2)return null;
var k=raw.indexOf("\u0301"), right=-1;
if(k>0){
var before=plain0(raw.slice(0,k)).length-1;
right=pos.indexOf(before);
}else{
for(i=0;i<pos.length;i++)if(plain.charAt(pos[i]).toLowerCase()==="ё"){right=i;break;}
}
if(right<0)return null;
return {plain:plain,pos:pos,right:right};
}
function plain0(s){return String(s||"").replace(/\u0301/g,"");}
function markAt(plain,at){
return esc(plain.slice(0,at))+'<b class="sv">'+esc(plain.charAt(at))+"\u0301</b>"+esc(plain.slice(at+1));
}
function stressStep(it){

var idxs=si.pos.map(function(_,i){return i;});
if(idxs.length>4){
var wrong=shuffle(idxs.filter(function(i){return i!==si.right;})).slice(0,3);
idxs=shuffle(wrong.concat([si.right]));
}
var opts=idxs.map(function(i){
return {txt:si.plain,html:markAt(si.plain,si.pos[i]),ok:i===si.right};
});
return {k:"mc",it:it,ask:"Trọng âm rơi vào đâu?",big:si.plain,cyr:true,sub:it.vi,
opts:opts,optCls:"stress",audio:it.ru};

function trRu(v){

var _timMod={};
function timKho(it){
if(!it._tim){
it._tim=it.t==="L"
? normTim(it.up+" "+it.lo+" "+it.nm+" "+it.nmv+" "+it.snd+" "+it.ex+" "+it.exen+" "+it.exvi)
: normTim(it.ru+" "+it.tr+" "+it.en+" "+it.vi);
}
return it._tim;
}
function timKhoMuc(id){
if(_timMod[id]===undefined){var m=modById(id);_timMod[id]=m?normTim(m.name+" "+m.ru):"";}
return _timMod[id];
}
function tachTu(cum){
return cum.split(" ").filter(Boolean).map(function(t){
return {t:t,re:new RegExp("(^| )"+t+"( |$)")};
});
}
function diemTim(hay,tenMuc,cum,tu){
var d=0,tron=0;
if(cum.length>1&&hay.indexOf(cum)>=0)d+=8;
for(var i=0;i<tu.length;i++){
var w=tu[i];
if(w.re.test(hay)){d+=4;tron++;}
else if(w.t.length>1&&hay.indexOf(w.t)>=0)d+=1;
if(tenMuc&&w.re.test(tenMuc))d+=1;
}
return {d:d,manh:tu.length>0&&tron===tu.length};
}
function timMuc(v){
var cum=normTim(v);
if(!cum)return [];
var cumRu=normTim(trRu(v));
var tu=tachTu(cum),tuRu=(cumRu&&cumRu!==cum)?tachTu(cumRu):null;
var ds=[];
ALL_ITEMS.forEach(function(it){
var hay=timKho(it),tm=timKhoMuc(it.mod);
var k=diemTim(hay,tm,cum,tu);
if(tuRu){var k2=diemTim(hay,tm,cumRu,tuRu);if(k2.d>k.d)k=k2;}
if(k.d>0)ds.push({it:it,d:k.d,manh:k.manh});
});
ds.sort(function(a,b){return (b.manh?1:0)-(a.manh?1:0)||b.d-a.d;});
return ds;
}

function demSo(node,hieuUng){
var dich=parseInt(node.getAttribute("data-to"),10)||0;
if(!hieuUng||dich<=0||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)){node.textContent=dich;return;}
var t0=0,dur=Math.min(260+dich*9,1150);
function b(t){
if(!t0)t0=t;
var e=Math.min(1,(t-t0)/dur), k=1-Math.pow(1-e,3);
node.textContent=Math.round(dich*k);
if(e<1)requestAnimationFrame(b);
}
requestAnimationFrame(b);
}
